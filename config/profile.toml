# ─────────────────────────────────────────────────────────────────────────────
#  The ONLY file you edit by hand for content (plus README.template.md for
#  prose). Everything data-driven — contributions, languages, monthly chart,
#  project cards — is regenerated by the GitHub Action. Never edit README.md.
# ─────────────────────────────────────────────────────────────────────────────

username = "Mohid-Abbas"          # your name is NOT repeated in the README:
                                  # GitHub already shows it beside your photo.

[hero]
eyebrow  = "AI AUTOMATION · AGENTIC SYSTEMS"
headline = ["I build AI systems", "that do real work."]     # exactly 2 lines
# Cycles every ~2.4 s. Every item should be backed by a repo you can link to.
rotating = [
  "RAG assistants with a FastAPI backend",
  "n8n + LangGraph agent workflows",
  "ML pipelines on sensor data",
  "ESP32 robots and wearables",
]
chip_label = "ESP32"              # label on the little chip in the hero art

[availability]                    # EDIT or set show = false — this is public text
show = true
text = "Open to Python/FastAPI backend & AI-automation roles"

[links]                           # empty string = hidden
linkedin  = "https://www.linkedin.com/in/muhammad-mohid-abbas"
email     = "mohidabbas.ai@gmail.com"
resume    = ""                    # e.g. "https://…/Mohid_Abbas_CV.pdf"
portfolio = ""

# ── Stack ────────────────────────────────────────────────────────────────────
# domain = "software" (teal) or "hardware" (amber). Only list things a repo of
# yours actually uses — add ROS 2 here the day a repo does.
[[stack]]
label  = "BACKEND"
domain = "software"
items  = ["Python", "FastAPI", "REST APIs", "Docker"]

[[stack]]
label  = "AI / LLM"
domain = "software"
items  = ["RAG", "LangChain", "LangGraph", "ChromaDB", "n8n"]

[[stack]]
label  = "ML"
domain = "software"
items  = ["PyTorch", "XGBoost", "LightGBM", "SHAP"]

[[stack]]
label  = "EMBEDDED"
domain = "hardware"
items  = ["C++", "ESP32", "PID control", "Sensors"]

# ── Projects ─────────────────────────────────────────────────────────────────
[projects]
source = "pinned"                 # "pinned" = whatever you pin on GitHub (auto)
max    = 6
# Repos shown in amber / "HARDWARE". Everything else is teal / "AI · SOFTWARE".
# A repo with a topic like robotics, esp32, embedded, iot-hardware is also amber.
hardware_repos  = ["medidash-autonomous-vehicle", "synapse-context-aware-companion"]
hardware_topics = ["robotics", "esp32", "embedded", "ros2", "arduino"]

# Optional: replace the auto description with a sharper one that has a RESULT in
# it (accuracy, latency, users…). Only write numbers you can defend.
# [projects.override."rag-document-assistant"]
# tagline = "Answers questions over your PDFs with citations; FastAPI + ChromaDB."

# ── Charts ───────────────────────────────────────────────────────────────────
[languages]
top     = 6
exclude = ["Jupyter Notebook", "HTML", "CSS", "Dockerfile", "Shell", "Makefile"]
