<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 218" width="840" height="218" role="img" aria-label="Stack"><title>Stack</title><desc>BACKEND: Python, FastAPI, REST APIs, Docker; AI / LLM: RAG, LangChain, LangGraph, ChromaDB, n8n; ML: PyTorch, XGBoost, LightGBM, SHAP; EMBEDDED: C++, ESP32, PID control, Sensors</desc><style>svg{--panel:#ffffff;--border:#d0d7de;--text:#1f2328;--muted:#59636e;--teal:#0f766e;--amber:#b45309;--hi:#f59e0b;--pulse:#042f2e;--l0:#e6ebf1;--l1:#b7efe7;--l2:#5fd4c7;--l3:#1aa396;--l4:#0f766e;}
