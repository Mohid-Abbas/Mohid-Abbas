<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 156" width="410" height="156" role="img" aria-label="explainable-network-intrusion-detection — AI · SOFTWARE"><title>explainable-network-intrusion-detection — AI · SOFTWARE</title><desc>A production-style NIDS using XGBoost/LightGBM on CIC-IDS2017 to classify network traffic as benign or malicious. Features real-time prediction explainability via SHAP, resilience against adversarial evasion attacks, an ultra-fast FastAPI inference endpoint, and an interactive Streamlit dashboard tailored for threat analysis in a SOC.</desc><style>svg{--panel:#ffffff;--border:#d0d7de;--text:#1f2328;--muted:#59636e;--teal:#0f766e;--amber:#b45309;--hi:#f59e0b;--pulse:#042f2e;--l0:#e6ebf1;--l1:#b7efe7;--l2:#5fd4c7;--l3:#1aa396;--l4:#0f766e;}
