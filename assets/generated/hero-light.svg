<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="Hero"><title>Hero</title><desc>I build AI systems that do real work. — RAG assistants with a FastAPI backend, n8n + LangGraph agent workflows, ML pipelines on sensor data, ESP32 robots and wearables</desc><style>svg{--panel:#ffffff;--border:#d0d7de;--text:#1f2328;--muted:#59636e;--teal:#0f766e;--amber:#b45309;--hi:#f59e0b;--pulse:#042f2e;--l0:#e6ebf1;--l1:#b7efe7;--l2:#5fd4c7;--l3:#1aa396;--l4:#0f766e;}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.pk{display:none}}

.u{animation:up .8s cubic-bezier(.2,.8,.2,1) backwards}
.r{opacity:0;animation:rot 9.6s linear infinite;animation-fill-mode:backwards}
@media (prefers-reduced-motion:reduce){.r{opacity:0}.r.first{opacity:1}}
@keyframes rot{0%{opacity:0;transform:translateY(7px)}1.8%{opacity:1;transform:none}23.20%{opacity:1;transform:none}25.00%{opacity:0;transform:translateY(-7px)}100%{opacity:0}}
.n{animation:np 3.2s ease-in-out infinite;animation-delay:calc(var(--k)*.35s)}
@keyframes np{0%,100%{opacity:.45}50%{opacity:1}}
.dot{animation:ring 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ring{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(3)}}
.chip{opacity:.1;animation:cp 1.2s ease-in-out infinite}
@keyframes cp{0%,100%{opacity:.05}50%{opacity:.22}}
