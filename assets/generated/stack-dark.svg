<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 218" width="840" height="218" role="img" aria-label="Stack"><title>Stack</title><desc>BACKEND: Python, FastAPI, REST APIs, Docker; AI / LLM: RAG, LangChain, LangGraph, ChromaDB, n8n; ML: PyTorch, XGBoost, LightGBM, SHAP; EMBEDDED: C++, ESP32, PID control, Sensors</desc><style>svg{--panel:#0d1117;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--teal:#2dd4bf;--amber:#f59e0b;--hi:#fbbf24;--pulse:#d5fff8;--l0:#1b2432;--l1:#0e4a47;--l2:#0f766e;--l3:#14b8a6;--l4:#2dd4bf;}
